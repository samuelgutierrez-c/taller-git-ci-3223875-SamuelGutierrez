name: CI

on:
  push:
    branches: [ main, feat/ui-basica ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Prettier check
        run: npx prettier --check .

      - name: Run tests
        run: node --test
